name: Sync JSON to Serv00

on:
  push:
    paths:
      - 'data/*.json'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed JSON dates
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "$AFTER" -- 'data/*.json' > /tmp/changed.txt || true
          else
            git diff --name-only "$BEFORE" "$AFTER" -- 'data/*.json' > /tmp/changed.txt || true
          fi

          dates=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            name="$(basename "$file")"
            if [[ "$name" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$ ]]; then
              dates+=("${BASH_REMATCH[1]}")
            fi
          done < /tmp/changed.txt

          printf '%s\n' "${dates[@]}" | sort -u > /tmp/dates.txt
          echo "Changed files:"
          cat /tmp/changed.txt || true
          echo "Dates:"
          cat /tmp/dates.txt || true

          if [ -s /tmp/dates.txt ]; then
            echo 'has_dates=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_dates=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Serv00
        if: steps.changed.outputs.has_dates == 'true'
        env:
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SERV00_UPDATE_URL" ] || [ -z "$SERV00_UPDATE_TOKEN" ]; then
            echo '❌ 缺少 SERV00_UPDATE_URL 或 SERV00_UPDATE_TOKEN'
            exit 1
          fi

          while IFS= read -r date; do
            [ -z "$date" ] && continue
            echo "📡 同步 Serv00: $date"
            curl --fail-with-body --retry 5 --retry-delay 3 --max-time 60 \
              -X POST "$SERV00_UPDATE_URL" \
              -H "Authorization: Bearer $SERV00_UPDATE_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"date\":\"$date\"}"
            echo
          done < /tmp/dates.txt

      - name: Clear website cache
        if: steps.changed.outputs.has_dates == 'true'
        env:
          CACHE_TOKEN: ${{ secrets.CACHE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CACHE_TOKEN" ]; then
            echo 'ℹ️ 未設定 CACHE_TOKEN，略過快取清除'
            exit 0
          fi
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 -sS \
            "https://ailoom.ccwu.cc/cache_clear.php?token=${CACHE_TOKEN}" \
            -w '\nHTTP %{http_code}\n'

      - name: Summary
        if: always()
        run: |
          echo '## JSON → Serv00 同步' >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/dates.txt ]; then
            echo '**Dates:**' >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- /' /tmp/dates.txt >> "$GITHUB_STEP_SUMMARY"
          fi
