name: Daily News Sync

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = 台灣隔天 02:00
  workflow_dispatch:
    inputs:
      date:
        description: '指定新聞日期 (YYYY-MM-DD)，留空則使用昨天'
        required: false
        type: string
  push:
    paths:
      - 'data/*.json'

env:
  TZ: Asia/Taipei

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  # 每日排程／手動指定日期：完整執行「搜尋 → 分類 → 驗證 → 寫入 JSON → 通知 Serv00」。
  daily-news:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        run: python scripts/main.py --date "${{ inputs.date || '' }}"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

      - name: Calculate target date
        id: target
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            TARGET_DATE="${{ inputs.date }}"
          else
            TARGET_DATE="$(TZ=Asia/Taipei date -d 'yesterday' '+%Y-%m-%d')"
          fi
          echo "date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "📅 Target date: ${TARGET_DATE}"
          test -s "data/${TARGET_DATE}.json"

      - name: Cleanup old data
        run: find data -name "*.json" -mtime +30 -delete 2>/dev/null || true

      - name: Commit daily JSON to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "ℹ️ 沒有新的 data 變更（可能是重跑同一天資料）"
          else
            git commit -m "data: 新聞資料 ${{ steps.target.outputs.date }}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Notify Serv00
        env:
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          if [ -z "$SERV00_UPDATE_URL" ] || [ -z "$SERV00_UPDATE_TOKEN" ]; then
            echo "❌ 缺少 SERV00_UPDATE_URL 或 SERV00_UPDATE_TOKEN"
            exit 1
          fi
          echo "📡 通知 Serv00 更新日期: $TARGET_DATE"
          curl --fail-with-body --retry 5 --retry-delay 3 --max-time 60             -X POST "$SERV00_UPDATE_URL"             -H "Authorization: Bearer $SERV00_UPDATE_TOKEN"             -H "Content-Type: application/json"             --data "{\"date\":\"$TARGET_DATE\"}"

      - name: Clear website cache
        if: success()
        env:
          CACHE_TOKEN: ${{ secrets.CACHE_TOKEN }}
        run: |
          if [ -z "$CACHE_TOKEN" ]; then
            echo "ℹ️ 未設定 CACHE_TOKEN，略過快取清除"
          else
            curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 -sS               "https://ailoom.ccwu.cc/cache_clear.php?token=${CACHE_TOKEN}"               -w "\nHTTP %{http_code}\n"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Daily News Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.target.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"

  # 使用者直接新增／修改 data/*.json：只同步，不重新搜尋新聞、不消耗 AI 額度。
  sync-json-to-serv00:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed JSON dates
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "$AFTER" -- 'data/*.json' > /tmp/changed.txt || true
          else
            git diff --name-only "$BEFORE" "$AFTER" -- 'data/*.json' > /tmp/changed.txt || true
          fi

          : > /tmp/dates.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            name="$(basename "$file")"
            if [[ "$name" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$ ]]; then
              echo "${BASH_REMATCH[1]}" >> /tmp/dates.txt
            fi
          done < /tmp/changed.txt
          sort -u -o /tmp/dates.txt /tmp/dates.txt
          echo "=== Changed JSON ==="
          cat /tmp/changed.txt || true
          echo "=== Dates ==="
          cat /tmp/dates.txt || true
          if [ -s /tmp/dates.txt ]; then
            echo 'has_dates=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_dates=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Serv00 for each changed date
        if: steps.changed.outputs.has_dates == 'true'
        env:
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERV00_UPDATE_URL"
          test -n "$SERV00_UPDATE_TOKEN"
          while IFS= read -r date; do
            [ -z "$date" ] && continue
            echo "📡 同步 Serv00: $date"
            curl --fail-with-body --retry 5 --retry-delay 3 --max-time 60               -X POST "$SERV00_UPDATE_URL"               -H "Authorization: Bearer $SERV00_UPDATE_TOKEN"               -H "Content-Type: application/json"               --data "{\"date\":\"$date\"}"
            echo
          done < /tmp/dates.txt

      - name: Clear website cache
        if: steps.changed.outputs.has_dates == 'true'
        env:
          CACHE_TOKEN: ${{ secrets.CACHE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CACHE_TOKEN" ]; then exit 0; fi
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 -sS             "https://ailoom.ccwu.cc/cache_clear.php?token=${CACHE_TOKEN}"             -w '\nHTTP %{http_code}\n'

      - name: Summary
        if: always()
        run: |
          echo "## JSON → Serv00 同步" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/dates.txt ]; then sed 's/^/- /' /tmp/dates.txt >> "$GITHUB_STEP_SUMMARY"; fi

  delete-old-runs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs older than 3 days
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
